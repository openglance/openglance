<!doctype html>
<html lang="en" class="is-workbench-loading" data-locale="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenGlance</title>
    <script>
      window.OPENGLANCE_INITIAL_FILE = __OPENGLANCE_INITIAL_FILE__;
      window.OPENGLANCE_INITIAL_REPO = __OPENGLANCE_INITIAL_REPO__;
      window.OPENGLANCE_WORKTREE_ID = __OPENGLANCE_WORKTREE_ID__;
      window.OPENGLANCE_CAN_EDIT = __OPENGLANCE_CAN_EDIT__;
      window.OPENGLANCE_DESKTOP_PREFERENCES = __OPENGLANCE_DESKTOP_PREFERENCES__;
      window.OPENGLANCE_TELEMETRY_ENABLED = __OPENGLANCE_TELEMETRY_ENABLED__;
      (() => {
        const preferences = window.OPENGLANCE_DESKTOP_PREFERENCES;
        const language = String(preferences?.language || "system").trim().toLowerCase();
        const desktopResolvedLanguage = preferences?.resolvedLanguage === "zh-CN"
          ? "zh-CN"
          : preferences?.resolvedLanguage === "en"
            ? "en"
            : "";
        const systemLanguages = Array.isArray(window.navigator.languages)
          ? window.navigator.languages
          : [window.navigator.language];
        let locale = desktopResolvedLanguage || (
          language === "zh-cn" || language === "zh" || language.startsWith("zh-")
            ? "zh-CN"
            : language === "en" || language.startsWith("en-")
              ? "en"
              : ""
        );
        if (!locale && (language === "" || language === "system")) {
          for (const candidate of systemLanguages) {
            const normalized = String(candidate || "").replaceAll("_", "-").toLowerCase();
            if (normalized === "zh" || normalized.startsWith("zh-")) {
              locale = "zh-CN";
              break;
            }
            if (normalized === "en" || normalized.startsWith("en-")) {
              locale = "en";
              break;
            }
          }
        }
        locale ||= "en";
        window.OPENGLANCE_INITIAL_LOCALE = locale;
        document.documentElement.lang = locale;
        document.documentElement.dataset.locale = locale;
        let colorMode = preferences?.colorMode;
        if (!["system", "light", "dark"].includes(colorMode)) {
          try {
            colorMode = window.localStorage.getItem("git-leaf-theme") || "light";
          } catch {
            colorMode = "light";
          }
        }
        const systemDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches === true;
        const theme = colorMode === "dark" || (colorMode === "system" && systemDark)
          ? "dark"
          : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      :root {
        --workbench-loading-bg: #f6f7f9;
        --workbench-loading-text: #17202e;
        --workbench-loading-muted: #667085;
        --workbench-loading-accent: #2563eb;
        background: var(--workbench-loading-bg);
      }

      :root[data-theme="dark"] {
        --workbench-loading-bg: #111214;
        --workbench-loading-text: #f2f1ec;
        --workbench-loading-muted: #aaa59c;
        --workbench-loading-accent: #7aa2f7;
      }

      .is-workbench-loading #app-shell {
        visibility: hidden;
      }

      :root[data-locale="en"] [data-initial-locale="zh-CN"],
      :root[data-locale="zh-CN"] [data-initial-locale="en"] {
        display: none;
      }

      #workbench-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px;
        background: var(--workbench-loading-bg);
        color: var(--workbench-loading-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 120ms ease-out;
      }

      .is-workbench-ready #workbench-loading {
        opacity: 0;
        pointer-events: none;
      }

      .workbench-loading-inner {
        width: min(720px, calc(100vw - 48px));
      }

      .workbench-loading-indicator {
        width: 28px;
        height: 28px;
        margin-bottom: 22px;
        border: 3px solid color-mix(in srgb, var(--workbench-loading-accent) 24%, transparent);
        border-top-color: var(--workbench-loading-accent);
        border-radius: 999px;
        animation: workbench-loading-spin 0.8s linear infinite;
      }

      #workbench-loading h1 {
        margin: 0 0 12px;
        font-size: 30px;
        line-height: 1.2;
        font-weight: 680;
      }

      #workbench-loading p {
        margin: 0;
        color: var(--workbench-loading-muted);
        font-size: 15px;
        line-height: 1.65;
      }

      @keyframes workbench-loading-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #workbench-loading { transition: none; }
        .workbench-loading-indicator { animation-duration: 1.6s; }
      }
    </style>
    <link rel="stylesheet" href="/styles.css?v=__OPENGLANCE_ASSET_VERSION__">
  </head>
  <body>
    <div id="workbench-loading" role="status" aria-live="polite" aria-busy="true">

        <p>

          <span data-initial-locale="zh-CN">正在准备文档与工作区。</span>
        </p>
      </div>
    </div>

              </button>
            </span>

              <button id="mode-source" type="button" data-mode="source" aria-pressed="false">Source</button>

            <div

              class="frontmatter-active-filters"

              data-i18n-aria-label="aria.activeFrontmatterFilters"

            <div id="git-change-toolbar" class="git-change-toolbar" aria-live="polite" hidden>

                <span class="git-sync-status-row">

          </div>
          <div
            id="image-popover"
            class="image-popover live-edit-toolbar"
            role="toolbar"
            aria-label="图片操作"

            <button type="button" data-image-action="align-left" data-i18n="action.alignLeft">左对齐</button>

            <button type="button" data-image-action="grow" data-i18n="action.grow">放大</button>
            <button type="button" data-image-action="caption" data-i18n="action.caption">说明</button>
            <button class="live-edit-toolbar-close" type="button" data-image-action="close" aria-label="关闭" data-i18n-aria-label="action.close">×</button>
          </div>
          <div
            id="link-popover"
            class="link-popover live-edit-toolbar"
            role="toolbar"
            aria-label="链接操作"
            data-i18n-aria-label="aria.linkActions"
            hidden
          >
            <button type="button" data-link-action="edit" data-i18n="action.editLink">修改链接</button>
            <button type="button" data-link-action="open" data-i18n="action.openLink">打开链接</button>
            <button type="button" data-link-action="open-tab" data-i18n="action.openInNewTab">新标签页</button>
            <button class="live-edit-toolbar-close" type="button" data-link-action="close" aria-label="关闭" data-i18n-aria-label="action.close">×</button>
          </div>
          <div
            id="frontmatter-field-popover"
            class="frontmatter-field-popover live-edit-toolbar"
            role="toolbar"
            aria-label="Frontmatter 字段操作"
            data-i18n-aria-label="aria.frontmatterFieldActions"
            hidden
          ></div>
          <div id="copy-toast" class="copy-toast" role="status" aria-live="polite" hidden></div>
        </main>
      </div>
      <div id="ui-tooltip" class="ui-tooltip" role="tooltip" aria-hidden="true" hidden></div>
      <div id="file-action-menu" class="file-action-menu" role="menu" aria-label="文件操作" data-i18n-aria-label="aria.fileActions" hidden></div>
      <div id="repository-panel" class="repository-panel" role="dialog" aria-modal="true" aria-labelledby="repository-panel-title" hidden>
        <section class="repository-panel-card">
          <header class="repository-panel-header">
            <h2 id="repository-panel-title" data-i18n="repository.title">仓库</h2>
            <button id="repository-panel-close" type="button" aria-label="关闭" data-ui-tooltip="关闭" data-i18n-aria-label="action.close" data-i18n-data-ui-tooltip="action.close">×</button>
          </header>
          <label class="repository-panel-search">
            <span class="visually-hidden" data-i18n="repository.searchLabel">搜索仓库</span>
            <input
              id="repository-panel-search"
              type="search"
              placeholder="搜索仓库…"
              data-i18n-placeholder="repository.searchPlaceholder"
              autocomplete="off"
              spellcheck="false"
              aria-controls="repository-panel-list"
            >
          </label>
          <div id="repository-panel-list" class="repository-panel-list" role="listbox" aria-label="已打开的仓库" data-i18n-aria-label="repository.openRepositories"></div>
          <p id="repository-panel-empty" class="repository-panel-empty" data-i18n="repository.empty" hidden>没有匹配的仓库。</p>
          <footer class="repository-panel-footer">
            <button id="repository-panel-open" type="button">
              <span data-i18n="repository.openAnother">打开另一个本机仓库…</span>
              <kbd aria-hidden="true">⌘0</kbd>
            </button>
          </footer>
        </section>
      </div>
      <div id="git-sync-panel" class="git-sync-panel" role="dialog" aria-modal="true" aria-labelledby="git-sync-title" hidden>
        <section class="git-sync-dialog">
          <header class="git-sync-header">
            <div>
              <h2 id="git-sync-title" data-i18n="sync.agentTitle">需要 AI Agent 处理</h2>
              <p data-i18n="sync.agentDetail">本地修改都已保留，可以交给 AI Agent 继续完成同步。</p>
            </div>
            <button id="git-sync-close" type="button" aria-label="关闭同步面板" data-ui-tooltip="关闭" data-i18n-aria-label="action.close" data-i18n-data-ui-tooltip="action.close">×</button>
          </header>
          <div id="git-sync-result" class="git-sync-result" hidden>
            <p id="git-sync-result-title"></p>
            <p id="git-sync-result-help"></p>
            <textarea id="git-sync-agent-prompt" rows="10" readonly></textarea>
            <button id="git-sync-copy-prompt" type="button" data-i18n="action.copyAgentPrompt">复制提示词</button>
          </div>
        </section>
      </div>
      <div id="app-dialog" class="app-dialog" role="dialog" aria-modal="true" aria-labelledby="app-dialog-title" hidden>
        <section id="app-dialog-card" class="app-dialog-card">
          <header class="app-dialog-header">
            <h2 id="app-dialog-title"></h2>
            <button id="app-dialog-close" type="button" aria-label="关闭" data-ui-tooltip="关闭" data-i18n-aria-label="action.close" data-i18n-data-ui-tooltip="action.close">×</button>
          </header>
          <p id="app-dialog-message" class="app-dialog-message"></p>
          <div id="app-dialog-content" class="app-dialog-content" hidden></div>
          <label id="app-dialog-input-wrap" class="app-dialog-input-wrap" hidden>
            <span id="app-dialog-input-label"></span>
            <input id="app-dialog-input" type="text">
          </label>
          <div id="app-dialog-fields" class="app-dialog-fields" hidden></div>
          <div id="app-dialog-actions" class="app-dialog-actions">
            <button id="app-dialog-cancel" type="button" data-i18n="action.cancel">取消</button>
            <button id="app-dialog-confirm" type="button" data-i18n="action.confirm">确定</button>
          </div>
        </section>
      </div>
    </div>
    <script src="/app.js?v=__OPENGLANCE_ASSET_VERSION__" type="module"></script>
  </body>
</html>
